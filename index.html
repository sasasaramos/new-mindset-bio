<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW MINDSET</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0a0a0a;
    --grid-line: rgba(255,255,255,0.06);
    --accent: #ffffff;
    --accent-dim: rgba(255,255,255,0.12);
    --text: #f5f5f0;
    --text-dim: #8a8a85;
    --card-bg: #131313;
    --card-border: #232323;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    justify-content:center;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-position: center;
  }

  /* vinheta pra dar profundidade no grid */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.9), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    padding: 56px 20px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ===== AVATAR ===== */
  .avatar-slot{
    width:96px;
    height:96px;
    border-radius:50%;
    background:var(--card-bg);
    border:2px solid var(--accent);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.08), 0 0 40px rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
    opacity:0;
    animation: pop-in 0.6s cubic-bezier(.2,.9,.25,1.2) 0.1s forwards;
  }
  .avatar-slot img{width:100%;height:100%;object-fit:cover;display:none;}

  /* ===== HEADER ===== */
  .header{
    text-align:center;
    margin-top:22px;
    opacity:0;
    animation: fade-up 0.7s ease 0.25s forwards;
  }

  .title{
    font-family:'Archivo Black', sans-serif;
    font-size: 26px;
    letter-spacing: 0.5px;
    line-height:1.15;
    text-transform:uppercase;
  }
  .title span{
    color:var(--accent);
    text-shadow: 0 0 12px rgba(255,255,255,0.55), 0 0 28px rgba(255,255,255,0.25);
  }

  .subtitle{
    margin-top:10px;
    font-size:14.5px;
    color:var(--text-dim);
    line-height:1.5;
    max-width:290px;
    margin-left:auto;
    margin-right:auto;
  }

  .subtitle strong{color:var(--text); font-weight:600;}

  /* ===== TAG ROW ===== */
  .tags{
    display:flex;
    gap:8px;
    margin-top:16px;
    opacity:0;
    animation: fade-up 0.7s ease 0.35s forwards;
  }
  .tag{
    font-size:11px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid rgba(255,255,255,0.3);
    background:var(--accent-dim);
    padding:5px 10px;
    border-radius:100px;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }

  /* ===== LINKS ===== */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:34px;
  }

  .card{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio: 16 / 9;
    background:var(--card-bg);
    border:1.5px solid var(--card-border);
    border-radius:16px;
    text-decoration:none;
    color:var(--text);
    overflow:hidden;
    opacity:0;
    transform:translateY(16px);
    animation: card-in 0.85s cubic-bezier(.2,.85,.25,1) forwards;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card:nth-child(1){animation-delay:0.45s;}
  .card:nth-child(2){animation-delay:0.62s;}
  .card:nth-child(3){animation-delay:0.79s;}
  .card:nth-child(4){animation-delay:0.96s;}

  .card:hover{
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.5), 0 10px 40px rgba(255,255,255,0.22), 0 0 24px rgba(255,255,255,0.18);
  }
  .card:active{transform: translateY(0px) scale(0.98);}

  .card-cover{
    width:100%;
    height:100%;
    background:
      repeating-linear-gradient(45deg, #1c1c1c, #1c1c1c 6px, #181818 6px, #181818 12px);
    border:1px dashed #3a3a3a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none; /* muda pra block quando colocar a imagem real */
  }
  .cover-icon{
    font-size:22px;
    opacity:0.35;
    color:var(--text-dim);
  }

  /* destaque especial pros produtos (ebook / saas) */
  .card.featured{
    border-color: rgba(255,255,255,0.25);
    background: linear-gradient(180deg, rgba(255,255,255,0.05), var(--card-bg) 60%);
  }
  .card.featured .card-label{color:var(--accent);}

  /* ===== FOOTER ===== */

  .footer{
    margin-top:42px;
    text-align:center;
    opacity:0;
    animation: fade-up 0.7s ease 0.9s forwards;
  }
  .footer-line{
    font-size:11px;
    color:#4a4a45;
    letter-spacing:0.5px;
  }

  @keyframes fade-up{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes card-in{
    from{opacity:0; transform:translateY(46px) scale(0.92); filter:blur(6px);}
    60%{opacity:1; filter:blur(0px);}
    to{opacity:1; transform:translateY(0) scale(1); filter:blur(0px);}
  }
  @keyframes pop-in{
    from{opacity:0; transform:scale(0.6);}
    to{opacity:1; transform:scale(1);}
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-slot,.header,.tags,.card,.footer{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    .ghost-rain{display:none !important;}
  }

  /* ===== CHUVA DE FANTASMAS ===== */
  .ghost-rain{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }
  .ghost-drop{
    position:absolute;
    top:-80px;
    width:34px;
    height:34px;
    opacity:0;
    animation-name: ghost-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .ghost-drop img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 82%, transparent 100%);
  }

  @keyframes ghost-fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    6%{ opacity:0.85; }
    92%{ opacity:0.85; }
    100%{ transform: translateY(112vh) rotate(14deg); opacity:0; }
  }
</style>
</head>

  function playIntroSound(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(320, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(640, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.4);
    }catch(e){}
  }

  function spawnGhostRain(count = 14){
    const container = document.getElementById('ghost-rain');
    if(!container) return;
    for(let i = 0; i < count; i++){
      const drop = document.createElement('div');
      drop.className = 'ghost-drop';

      const size = 22 + Math.random() * 30;      // tamanho variado
      const left = Math.random() * 100;          // posição horizontal
      const duration = 7 + Math.random() * 8;    // velocidade de queda
      const delay = Math.random() * -14;         // começa em pontos diferentes do ciclo

      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = left + 'vw';
      drop.style.animationDuration = duration + 's';
      drop.style.animationDelay = delay + 's';

      const img = document.createElement('img');
      img.src = Math.random() < 0.5 ? GHOST_SRC : GHOST_SRC_FLIP;
      img.alt = '';
      drop.appendChild(img);

      container.appendChild(drop);
    }
  }
  spawnGhostRain();
</script>
